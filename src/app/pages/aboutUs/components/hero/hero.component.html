<section class="page-hero">
  <div class="hero-grid"></div>

  <div class="hero-orbit hero-orbit-1"></div>
  <div class="hero-orbit hero-orbit-2"></div>

  <div class="hero-content container">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      {{ translations[currentLanguage].aboutUs.tag }}
    </div>

    <h1>
      {{ translations[currentLanguage].aboutUs.title }}
    </h1>

    <p>
      {{ translations[currentLanguage].aboutUs.description }}
    </p>

    <div class="hero-line">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="hero-scroll">
    <span></span>
    <small>SCROLL</small>
  </div>
</section>
