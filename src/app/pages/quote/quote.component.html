<main>
  <section class="page-hero">
    <div class="container">
      <span class="tag">
        {{ translations[currentLanguage].quote.tag }}
      </span>

      <h1>
        {{ translations[currentLanguage].quote.title }}
      </h1>

      <p>
        {{ translations[currentLanguage].quote.description }}
      </p>
    </div>
  </section>

  <section class="quote-section">
    <div class="container">
      <form class="quote-form" (ngSubmit)="submitQuote()">
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">
              {{ translations[currentLanguage].quote.fullName }}
            </label>

            <input id="fullName" name="fullName" type="text" required />
          </div>

          <div class="form-group">
            <label for="company">
              {{ translations[currentLanguage].quote.company }}
            </label>

            <input id="company" name="company" type="text" />
          </div>

          <div class="form-group">
            <label for="email">
              {{ translations[currentLanguage].quote.email }}
            </label>

            <input id="email" name="email" type="email" required />
          </div>

          <div class="form-group">
            <label for="phone">
              {{ translations[currentLanguage].quote.phone }}
            </label>

            <input id="phone" name="phone" type="tel" />
          </div>
        </div>

        <div class="form-group">
          <label for="interest">
            {{ translations[currentLanguage].quote.interested }}
          </label>

          <select id="interest" name="interest" required>
            <option value="">-</option>

            <option value="containers">
              {{ translations[currentLanguage].quote.containers }}
            </option>

            <option value="pallets">
              {{ translations[currentLanguage].quote.pallets }}
            </option>

            <option value="logistics">
              {{ translations[currentLanguage].quote.logistics }}
            </option>

            <option value="other">
              {{ translations[currentLanguage].quote.other }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">
            {{ translations[currentLanguage].quote.quantity }}
          </label>

          <input id="quantity" name="quantity" type="number" min="1" />
        </div>

        <div class="form-group">
          <label for="additionalInfo">
            {{ translations[currentLanguage].quote.additionalInfo }}
          </label>

          <textarea id="additionalInfo" name="additionalInfo" rows="6"> </textarea>
        </div>

        <button type="submit" class="submit-button">
          {{ translations[currentLanguage].quote.submit }}
        </button>

        @if (submitted) {
          <div class="success-message">
            {{ translations[currentLanguage].quote.success }}
          </div>
        }
      </form>
    </div>
  </section>
</main>
